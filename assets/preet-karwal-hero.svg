<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="pkV2HeroTitle pkV2HeroDesc">
  <title id="pkV2HeroTitle">Preet Karwal — Full-Stack and AI Systems Engineer</title>
  <desc id="pkV2HeroDesc">Editorial portfolio cover introducing Preet Karwal and his full-stack and AI systems focus.</desc>
  <defs>
    <radialGradient id="pkV2HeroAmbient" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#F4F3E9" stop-opacity=".5"/>
      <stop offset=".58" stop-color="#AEB7A1" stop-opacity=".16"/>
      <stop offset="1" stop-color="#AEB7A1" stop-opacity="0"/>
    </radialGradient>
    <pattern id="pkV2HeroGrid" width="190" height="58" patternUnits="userSpaceOnUse">
      <path d="M190 0H0V58" fill="none" stroke="#131B10" stroke-opacity="0.055"/>
    </pattern>
    <style>
      .pk-v2-display { font-family: 'Arial Narrow', 'Helvetica Neue Condensed', 'Liberation Sans Narrow', system-ui, sans-serif; font-stretch: condensed; }
      .pk-v2-body { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }
      .pk-v2-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .pk-v2-name { font-size: 112px; font-weight: 800; letter-spacing: -7px; }
      .pk-v2-role { font-size: 36px; font-weight: 700; letter-spacing: -1.4px; }
      .pk-v2-kicker { font-size: 11px; font-weight: 650; letter-spacing: 1.5px; }
      .pk-v2-copy { font-size: 22px; font-weight: 520; letter-spacing: -.25px; }
      .pk-v2-mobile { display: none; }
      @media (max-width: 520px) {
        .pk-v2-desktop { display: none; }
        .pk-v2-mobile { display: inline; }
        .pk-v2-mobile-kicker { font-size: 25px; letter-spacing: 3px; }
        .pk-v2-mobile-name { font-size: 132px; letter-spacing: -8px; }
        .pk-v2-mobile-role { font-size: 44px; letter-spacing: -1px; }
      }
      @media (prefers-reduced-motion: reduce) {
        .pk-v2-hero-motion { display: none; }
      }
    </style>
  </defs>

  <rect width="1200" height="520" rx="32" fill="#E2E3D3"/>
  <rect x="24" y="24" width="1152" height="472" rx="24" fill="#CDD2BE"/>
  <rect x="24" y="24" width="1152" height="472" rx="24" fill="url(#pkV2HeroGrid)"/>

  <g class="pk-v2-desktop">
    <rect x="782" y="24" width="394" height="472" rx="24" fill="#131B10"/>
    <path d="M782 48V472" stroke="#FF4B0A" stroke-width="5"/>
    <g class="pk-v2-hero-motion" opacity=".3">
      <ellipse cx="298" cy="170" rx="250" ry="168" fill="url(#pkV2HeroAmbient)">
        <animateTransform attributeName="transform" type="translate" values="0 0;86 22;0 0" dur="18s" repeatCount="indefinite"/>
      </ellipse>
    </g>

    <text class="pk-v2-mono pk-v2-kicker" x="52" y="62" fill="#131B10">portfolio / engineering systems</text>
    <text class="pk-v2-mono pk-v2-kicker" x="748" y="62" fill="#6B7063" text-anchor="end">Sonipat · India</text>

    <text class="pk-v2-display pk-v2-name" x="48" y="190" fill="#131B10">PREET</text>
    <text class="pk-v2-display pk-v2-name" x="48" y="287" fill="#131B10">KARWAL</text>

    <line x1="52" y1="331" x2="704" y2="331" stroke="#131B10" stroke-opacity="0.24"/>
    <line x1="52" y1="331" x2="190" y2="331" stroke="#FF4B0A" stroke-width="5"/>
    <text class="pk-v2-body pk-v2-copy" x="52" y="382" fill="#131B10">I build product interfaces, backend systems,</text>
    <text class="pk-v2-body pk-v2-copy" x="52" y="414" fill="#131B10">and applied AI tools that teams can operate.</text>
    <text class="pk-v2-mono pk-v2-kicker" x="52" y="466" fill="#131B10" fill-opacity="0.7">4+ years documented experience</text>

    <g transform="translate(826 86)">
      <text class="pk-v2-mono pk-v2-kicker" x="0" y="0" fill="#AEB7A1">role / 01</text>
      <text class="pk-v2-body pk-v2-role" x="0" y="78" fill="#F4F3E9">Full-stack</text>
      <text class="pk-v2-body pk-v2-role" x="0" y="123" fill="#F4F3E9">&amp; AI systems</text>
      <text class="pk-v2-body pk-v2-role" x="0" y="168" fill="#F4F3E9">engineer.</text>

      <path d="M0 240H298" stroke="#AEB7A1" stroke-opacity="0.35" stroke-width="2"/>
      <circle cx="0" cy="240" r="5" fill="#FF4B0A"/>
      <circle cx="99" cy="240" r="4" fill="#131B10" stroke="#AEB7A1"/>
      <circle cx="198" cy="240" r="4" fill="#131B10" stroke="#AEB7A1"/>
      <circle cx="298" cy="240" r="4" fill="#131B10" stroke="#AEB7A1"/>
      <g class="pk-v2-hero-motion">
        <path d="M0 240H298" stroke="#FF4B0A" stroke-width="4" stroke-linecap="round" stroke-dasharray="26 272">
          <animate attributeName="stroke-dashoffset" values="298;0" dur="9s" repeatCount="indefinite"/>
        </path>
        <circle r="4" fill="#F4F3E9" opacity=".8">
          <animateMotion path="M0 240H298" dur="9s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values=".15;.8;.15" dur="9s" repeatCount="indefinite"/>
        </circle>
      </g>
      <g class="pk-v2-mono pk-v2-kicker" fill="#AEB7A1">
        <text x="0" y="278">interface</text>
        <text x="99" y="278">API</text>
        <text x="198" y="278">data</text>
        <text x="298" y="278" text-anchor="end">AI</text>
      </g>
    </g>
  </g>

  <g class="pk-v2-mobile">
    <rect x="24" y="24" width="1152" height="472" rx="24" fill="#131B10"/>
    <g class="pk-v2-hero-motion" opacity=".18">
      <ellipse cx="310" cy="188" rx="330" ry="210" fill="url(#pkV2HeroAmbient)">
        <animateTransform attributeName="transform" type="translate" values="0 0;160 0;0 0" dur="18s" repeatCount="indefinite"/>
      </ellipse>
    </g>
    <path d="M52 52H292" stroke="#FF4B0A" stroke-width="8"/>
    <text class="pk-v2-mono pk-v2-kicker pk-v2-mobile-kicker" x="52" y="102" fill="#AEB7A1">PK / systems engineer</text>
    <text class="pk-v2-display pk-v2-name pk-v2-mobile-name" x="48" y="230" fill="#F4F3E9">PREET</text>
    <text class="pk-v2-display pk-v2-name pk-v2-mobile-name" x="48" y="343" fill="#F4F3E9">KARWAL</text>
    <text class="pk-v2-body pk-v2-role pk-v2-mobile-role" x="54" y="425" fill="#CDD2BE">Full-stack + AI systems.</text>
  </g>
</svg>
