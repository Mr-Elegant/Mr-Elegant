  <title id="pkV2CapabilitiesTitle">Preet Karwal's skills</title>
  <desc id="pkV2CapabilitiesDesc">Individually enclosed technology and capability chips arranged beneath six engineering categories. The chips are visual labels, not interactive controls. A restrained orange rail highlights each category in sequence.</desc>
  <defs>
    <style>
      .pk-cap-display{font-family:'Arial Narrow','Helvetica Neue Condensed','Liberation Sans Narrow',system-ui,sans-serif;font-stretch:condensed}
      .pk-cap-body{font-family:system-ui,-apple-system,'Segoe UI',sans-serif}
      .pk-cap-mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .pk-cap-title{font-size:64px;font-weight:790;letter-spacing:-2.8px}
