<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="pkV2CapabilitiesTitle pkV2CapabilitiesDesc">
  <title id="pkV2CapabilitiesTitle">Preet Karwal's capability architecture</title>
  <desc id="pkV2CapabilitiesDesc">An animated system map connecting product interfaces, APIs and real-time services, data, applied AI, security controls, and infrastructure.</desc>
  <defs>
    <style>
      .pk-v2-cap-display { font-family: 'Arial Narrow', 'Helvetica Neue Condensed', 'Liberation Sans Narrow', system-ui, sans-serif; font-stretch: condensed; }
      .pk-v2-cap-body { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }
      .pk-v2-cap-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .pk-v2-cap-title { font-size: 51px; font-weight: 780; letter-spacing: -2px; }
      .pk-v2-cap-category { font-size: 25px; font-weight: 720; letter-spacing: -.8px; }
      .pk-v2-cap-tech { font-size: 15px; font-weight: 520; letter-spacing: -.1px; }
      .pk-v2-cap-kicker { font-size: 11px; font-weight: 650; letter-spacing: 1.4px; }
      .pk-v2-cap-mobile { display: none; }
      @media (max-width: 520px) {
        .pk-v2-cap-desktop { display: none; }
        .pk-v2-cap-mobile { display: inline; }
        .pk-v2-cap-mobile-title { font-size: 58px; letter-spacing: -2px; }
        .pk-v2-cap-mobile-category { font-size: 38px; letter-spacing: -1px; }
        .pk-v2-cap-mobile-tech { font-size: 27px; letter-spacing: 0; }
        .pk-v2-cap-mobile-kicker { font-size: 24px; letter-spacing: 2.8px; }
      }
      @media (prefers-reduced-motion: reduce) {
        .pk-v2-cap-motion { display: none; }
      }
    </style>
  </defs>

  <rect width="1200" height="650" rx="28" fill="#F4F3E9"/>
  <rect x="24" y="24" width="286" height="602" rx="20" fill="#131B10"/>
  <path d="M334 24V626M334 124H1176M334 218H1176M334 312H1176M334 406H1176M334 500H1176" fill="none" stroke="#131B10" stroke-opacity="0.13"/>

  <g class="pk-v2-cap-desktop">
    <text class="pk-v2-cap-mono pk-v2-cap-kicker" x="56" y="66" fill="#AEB7A1">02 / capability architecture</text>
    <text class="pk-v2-cap-display pk-v2-cap-title" x="56" y="150" fill="#F4F3E9">THE</text>
    <text class="pk-v2-cap-display pk-v2-cap-title" x="56" y="207" fill="#F4F3E9">WORKING</text>
    <text class="pk-v2-cap-display pk-v2-cap-title" x="56" y="264" fill="#F4F3E9">SYSTEM.</text>
    <text class="pk-v2-cap-body pk-v2-cap-tech" x="56" y="336" fill="#AEB7A1">Six connected layers.</text>
    <text class="pk-v2-cap-body pk-v2-cap-tech" x="56" y="361" fill="#AEB7A1">One delivery path.</text>
    <path d="M56 416H266" stroke="#AEB7A1" stroke-opacity="0.35"/>
    <text class="pk-v2-cap-mono pk-v2-cap-kicker" x="56" y="455" fill="#FF4B0A">signal / system flow</text>
    <text class="pk-v2-cap-body pk-v2-cap-tech" x="56" y="517" fill="#AEB7A1">The line moves through the</text>
    <text class="pk-v2-cap-body pk-v2-cap-tech" x="56" y="542" fill="#AEB7A1">same layers used to ship</text>
    <text class="pk-v2-cap-body pk-v2-cap-tech" x="56" y="567" fill="#AEB7A1">production software.</text>

    <g transform="translate(370 76)">
      <path d="M0 0V474" stroke="#6B7063" stroke-opacity="0.5" stroke-width="3"/>
      <g fill="#F4F3E9" stroke="#131B10" stroke-width="2">
        <circle cx="0" cy="0" r="7"/><circle cx="0" cy="94" r="7"/><circle cx="0" cy="188" r="7"/>
        <circle cx="0" cy="282" r="7"/><circle cx="0" cy="376" r="7"/><circle cx="0" cy="474" r="7"/>
      </g>
      <circle cx="0" cy="0" r="5" fill="#FF4B0A" stroke="none"/>
      <g class="pk-v2-cap-motion">
        <path d="M0 0V474" stroke="#FF4B0A" stroke-width="5" stroke-linecap="round" stroke-dasharray="34 440">
          <animate attributeName="stroke-dashoffset" values="474;0" dur="7s" repeatCount="indefinite"/>
        </path>
      </g>

      <g transform="translate(34 -10)">
        <text class="pk-v2-cap-body pk-v2-cap-category" x="0" y="0" fill="#131B10">Product interfaces</text>
        <text class="pk-v2-cap-body pk-v2-cap-tech" x="260" y="-7" fill="#6B7063">React · Next.js · TypeScript · Redux Toolkit · TanStack Query</text>
        <text class="pk-v2-cap-body pk-v2-cap-tech" x="260" y="17" fill="#6B7063">Tailwind CSS · shadcn/ui</text>
      </g>
      <g transform="translate(34 84)">
        <text class="pk-v2-cap-body pk-v2-cap-category" x="0" y="0" fill="#131B10">APIs + real-time</text>
        <text class="pk-v2-cap-body pk-v2-cap-tech" x="260" y="-7" fill="#6B7063">Node.js · Express · REST · GraphQL · Socket.IO</text>
        <text class="pk-v2-cap-body pk-v2-cap-tech" x="260" y="17" fill="#6B7063">SSE · BullMQ · Redis Pub/Sub</text>
      </g>
      <g transform="translate(34 178)">
        <text class="pk-v2-cap-body pk-v2-cap-category" x="0" y="0" fill="#131B10">Data systems</text>
        <text class="pk-v2-cap-body pk-v2-cap-tech" x="260" y="0" fill="#6B7063">MongoDB · PostgreSQL · MySQL · Prisma · Redis</text>
      </g>
      <g transform="translate(34 272)">
        <text class="pk-v2-cap-body pk-v2-cap-category" x="0" y="0" fill="#131B10">Applied AI</text>
        <text class="pk-v2-cap-body pk-v2-cap-tech" x="260" y="-7" fill="#6B7063">Vercel AI SDK · OpenRouter · Ollama · Gemini</text>
        <text class="pk-v2-cap-body pk-v2-cap-tech" x="260" y="17" fill="#6B7063">Mastra AI · MCP · tool calling</text>
      </g>
      <g transform="translate(34 366)">
        <text class="pk-v2-cap-body pk-v2-cap-category" x="0" y="0" fill="#131B10">Security controls</text>
        <text class="pk-v2-cap-body pk-v2-cap-tech" x="260" y="-7" fill="#6B7063">JWT · OAuth 2.0 · RBAC · Passport.js</text>
        <text class="pk-v2-cap-body pk-v2-cap-tech" x="260" y="17" fill="#6B7063">bcrypt · HMAC-SHA256 · input sanitization</text>
      </g>
      <g transform="translate(34 464)">
        <text class="pk-v2-cap-body pk-v2-cap-category" x="0" y="0" fill="#131B10">Infrastructure</text>
        <text class="pk-v2-cap-body pk-v2-cap-tech" x="260" y="0" fill="#6B7063">AWS · Docker · Kubernetes · Nginx · PM2 · GitHub CI/CD · Vercel</text>
      </g>
    </g>
  </g>

  <g class="pk-v2-cap-mobile">
    <rect x="24" y="24" width="1152" height="602" rx="20" fill="#131B10"/>
    <text class="pk-v2-cap-mono pk-v2-cap-kicker pk-v2-cap-mobile-kicker" x="54" y="66" fill="#AEB7A1">02 / capability architecture</text>
    <text class="pk-v2-cap-display pk-v2-cap-title pk-v2-cap-mobile-title" x="54" y="130" fill="#F4F3E9">THE WORKING SYSTEM.</text>
    <path d="M344 174V568" stroke="#AEB7A1" stroke-opacity="0.38" stroke-width="4"/>
    <g fill="#131B10" stroke="#F4F3E9" stroke-width="3">
      <circle cx="344" cy="174" r="9"/><circle cx="344" cy="253" r="9"/><circle cx="344" cy="332" r="9"/>
      <circle cx="344" cy="411" r="9"/><circle cx="344" cy="490" r="9"/><circle cx="344" cy="568" r="9"/>
    </g>
    <circle cx="344" cy="174" r="6" fill="#FF4B0A" stroke="none"/>
    <g class="pk-v2-cap-motion">
      <path d="M344 174V568" stroke="#FF4B0A" stroke-width="7" stroke-linecap="round" stroke-dasharray="42 352">
        <animate attributeName="stroke-dashoffset" values="394;0" dur="7s" repeatCount="indefinite"/>
      </path>
    </g>

    <g transform="translate(384 181)">
      <text class="pk-v2-cap-body pk-v2-cap-category pk-v2-cap-mobile-category" x="0" y="0" fill="#F4F3E9">Product interface</text>
      <text class="pk-v2-cap-body pk-v2-cap-tech pk-v2-cap-mobile-tech" x="0" y="31" fill="#AEB7A1">React · Next.js · TypeScript · Redux · TanStack Query</text>
    </g>
    <g transform="translate(384 260)">
      <text class="pk-v2-cap-body pk-v2-cap-category pk-v2-cap-mobile-category" x="0" y="0" fill="#F4F3E9">APIs + real-time</text>
      <text class="pk-v2-cap-body pk-v2-cap-tech pk-v2-cap-mobile-tech" x="0" y="31" fill="#AEB7A1">Node · Express · REST · GraphQL · Socket.IO · SSE</text>
    </g>
    <g transform="translate(384 339)">
      <text class="pk-v2-cap-body pk-v2-cap-category pk-v2-cap-mobile-category" x="0" y="0" fill="#F4F3E9">Data systems</text>
      <text class="pk-v2-cap-body pk-v2-cap-tech pk-v2-cap-mobile-tech" x="0" y="31" fill="#AEB7A1">MongoDB · PostgreSQL · MySQL · Prisma · Redis</text>
    </g>
    <g transform="translate(384 418)">
      <text class="pk-v2-cap-body pk-v2-cap-category pk-v2-cap-mobile-category" x="0" y="0" fill="#F4F3E9">Applied AI</text>
      <text class="pk-v2-cap-body pk-v2-cap-tech pk-v2-cap-mobile-tech" x="0" y="31" fill="#AEB7A1">AI SDK · OpenRouter · Ollama · Gemini · Mastra · MCP</text>
    </g>
    <g transform="translate(384 497)">
      <text class="pk-v2-cap-body pk-v2-cap-category pk-v2-cap-mobile-category" x="0" y="0" fill="#F4F3E9">Security</text>
      <text class="pk-v2-cap-body pk-v2-cap-tech pk-v2-cap-mobile-tech" x="0" y="31" fill="#AEB7A1">JWT · OAuth · RBAC · bcrypt · HMAC · sanitization</text>
    </g>
    <g transform="translate(384 576)">
      <text class="pk-v2-cap-body pk-v2-cap-category pk-v2-cap-mobile-category" x="0" y="0" fill="#F4F3E9">Infrastructure</text>
      <text class="pk-v2-cap-body pk-v2-cap-tech pk-v2-cap-mobile-tech" x="0" y="31" fill="#AEB7A1">AWS · Docker · Kubernetes · Nginx · CI/CD · Vercel</text>
    </g>
  </g>
