      .pk-cap-kicker{font-size:12px;font-weight:680;letter-spacing:1.5px}
      .pk-cap-chip text{font-size:20px;font-weight:650;fill:#131B10}
      .pk-cap-chip rect{fill:#CDD2BE;stroke:#131B10;stroke-opacity:.16}
      .pk-cap-chip path{stroke:#F4F3E9;stroke-opacity:.62}
      @media(max-width:520px){
        .pk-cap-title{font-size:72px}.pk-cap-category{font-size:32px}.pk-cap-category-long{font-size:27px}.pk-cap-kicker{font-size:20px;letter-spacing:2.2px}.pk-cap-chip text{font-size:24px}.pk-cap-chip-compact text{font-size:20px}
      }
      @media(prefers-reduced-motion:reduce){.pk-cap-motion{display:none}}
    </style>
